<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1 Year Anniversary 💜</title>

<style>
:root{
  --bg1:#f7f3ff;
  --bg2:#eadfff;
  --bg3:#d9c9ff;
  --accent:#a78bfa;
  --deep:#5b4b8a;
  --soft:#7a6fa3;
}

*{box-sizing:border-box;font-family:"Segoe UI",system-ui,sans-serif}

body{
  margin:0;
  min-height:100vh;
  background:linear-gradient(135deg,var(--bg1),var(--bg2),var(--bg3));
  overflow:hidden;
}

/* แสงพื้นหลัง */
.glow{
  position:fixed;
  width:460px;
  height:460px;
  background:radial-gradient(circle,rgba(210,185,255,.45),transparent 70%);
  filter:blur(70px);
  animation:glowMove 20s infinite alternate ease-in-out;
  z-index:0;
}
.glow.g1{top:-140px;left:-140px}
.glow.g2{bottom:-160px;right:-160px;animation-delay:7s}

@keyframes glowMove{
  from{transform:translateY(0)}
  to{transform:translateY(140px)}
}

/* เอฟเฟกลอย */
.bg{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:1;
}

.float-heart,.float-img{
  position:absolute;
  bottom:-90px;
  opacity:.8;
  animation:rise linear forwards;
}

.float-img{
  width:42px;
  height:42px;
  border-radius:50%;
  object-fit:cover;
  box-shadow:0 10px 22px rgba(140,100,200,.35);
}

@keyframes rise{
  from{transform:translateY(0) scale(.9);opacity:0}
  20%{opacity:.85}
  to{transform:translateY(-140vh) scale(1.15);opacity:0}
}

/* หน้าเข้า */
#intro{
  position:fixed;
  inset:0;
  z-index:30;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(135deg,#cbb6ff,#9f83ff);
  transition:1s ease;
}

.intro-box{
  background:rgba(255,255,255,.28);
  backdrop-filter:blur(16px);
  padding:50px 40px;
  border-radius:38px;
  text-align:center;
  color:#fff;
  box-shadow:0 30px 70px rgba(0,0,0,.25);
}

.intro-box h1{
  font-size:32px;
  margin-bottom:10px;
}

.intro-box p{
  font-size:15px;
  opacity:.95;
}

.intro-box button{
  margin-top:30px;
  padding:15px 46px;
  border:none;
  border-radius:32px;
  font-size:16px;
  cursor:pointer;
  background:#fff;
  color:#7a4bff;
  box-shadow:0 14px 36px rgba(0,0,0,.3);
}

/* หน้าหลัก */
.main{
  position:relative;
  z-index:10;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  opacity:0;
  transform:translateY(50px);
  transition:1s ease;
}
.main.show{opacity:1;transform:none}

/* การ์ด */
.card{
  max-width:520px;
  background:rgba(255,255,255,.8);
  backdrop-filter:blur(20px);
  border-radius:36px;
  padding:48px 34px;
  text-align:center;
  box-shadow:0 45px 90px rgba(140,110,200,.35);
}

/* รูปคู่ (ล็อกไม่ให้หาย) */
.photo-wrap{
  position:relative;
  width:200px;
  height:200px;
  margin:0 auto 22px;
}

.photo-wrap::before{
  content:"";
  position:absolute;
  inset:-16px;
  border-radius:50%;
  background:conic-gradient(#dbc9ff,#b99cff,#dbc9ff);
  filter:blur(12px);
  animation:spin 12s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

.photo{
  position:relative;
  width:100%;
  height:100%;
  border-radius:50%;
  overflow:hidden;
  border:7px solid rgba(255,255,255,.95);
  box-shadow:0 22px 50px rgba(140,110,200,.45);
  background:#fff;
}

.photo img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

/* ข้อความ */
h2{
  margin:20px 0 6px;
  font-size:32px;
  color:var(--deep);
}

.names{
  font-size:19px;
  color:#6a5f8f;
  margin-bottom:8px;
}

.badge{
  display:inline-block;
  margin-top:8px;
  padding:8px 20px;
  border-radius:24px;
  background:linear-gradient(135deg,#cbb6ff,#9a7dff);
  color:#fff;
  font-size:14px;
  box-shadow:0 12px 26px rgba(140,110,200,.45);
}

.msg{
  margin-top:26px;
  font-size:15px;
  line-height:2;
  color:#6a5f8f;
}
</style>
</head>

<body>

<div class="glow g1"></div>
<div class="glow g2"></div>
<div class="bg" id="bg"></div>

<!-- หน้าเข้า -->
<div id="intro">
  <div class="intro-box">
    <h1>สำหรับคนพิเศษ 💜</h1>
    <p>แตะเพื่อเปิดความทรงจำของเรา</p>
    <button onclick="enter()">✨ กดเพื่อเข้า</button>
  </div>
</div>

<!-- หน้าหลัก -->
<div class="main" id="main">
  <div class="card">

    <!-- รูปคู่ตรงกลาง -->
    <div class="photo-wrap">
      <div class="photo">
        <img src="main.jpg" alt="our photo">
      </div>
    </div>

    <h2>Happy Anniversary</h2>
    <div class="names">เอิร์ท 🤍 โอปอ</div>
    <div class="badge">💜 1 Year 💜</div>

    <div class="msg">
      (แก้ข้อความตรงนี้ได้เอง)<br><br>
      หนึ่งปีที่มีทั้งความรัก ความเข้าใจ  
      และการเติบโตไปด้วยกัน  
      ขอบคุณที่ยังจับมือกันมาถึงวันนี้
    </div>

  </div>
</div>

<script>
/* ===== เสียง Ambient อบอุ่นขึ้น ===== */
let audioCtx, master;

function startWarmSound(){
  audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  master = audioCtx.createGain();
  master.gain.value = 0.18;
  master.connect(audioCtx.destination);

  const chords = [
    [220,277,330],   // A minor
    [196,247,294],   // G
    [174,220,261],   // F
    [196,247,330]    // G sus
  ];

  chords.forEach((notes,i)=>{
    notes.forEach(freq=>{
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type="triangle";       // อบอุ่นกว่า sine
      osc.frequency.value=freq;
      gain.gain.value=0;
      osc.connect(gain);
      gain.connect(master);
      osc.start();

      function breathe(){
        gain.gain.setTargetAtTime(0.06,audioCtx.currentTime,3);
        setTimeout(()=>gain.gain.setTargetAtTime(0,audioCtx.currentTime,4),5000);
      }
      setInterval(breathe,8000+i*2000);
    });
  });
}

/* เข้าแอป */
const intro=document.getElementById("intro");
const main=document.getElementById("main");

function enter(){
  startWarmSound();
  intro.style.opacity="0";
  setTimeout(()=>{
    intro.style.display="none";
    main.classList.add("show");
  },900);
}

/* เอฟเฟกลอย */
const bg=document.getElementById("bg");
const hearts=["💜","🤍","✨","💫","💖"];
const imgs=["pic1.jpg","pic2.jpg"];

setInterval(()=>{
  if(Math.random()>0.45){
    const img=document.createElement("img");
    img.src=imgs[Math.floor(Math.random()*imgs.length)];
    img.className="float-img";
    img.style.left=Math.random()*100+"vw";
    img.style.animationDuration=(7+Math.random()*7)+"s";
    bg.appendChild(img);
    setTimeout(()=>img.remove(),17000);
  }else{
    const h=document.createElement("div");
    h.className="float-heart";
    h.textContent=hearts[Math.floor(Math.random()*hearts.length)];
    h.style.left=Math.random()*100+"vw";
    h.style.fontSize=(18+Math.random()*24)+"px";
    h.style.animationDuration=(6+Math.random()*7)+"s";
    bg.appendChild(h);
    setTimeout(()=>h.remove(),17000);
  }
},120);
</script>

</body>
</html>
